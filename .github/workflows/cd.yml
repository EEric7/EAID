name: CD - EAID

on:
  workflow_run:
    workflows: [CI - EAID]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Resolve source revision
        id: revision
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${WORKFLOW_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Validate Cloudflare configuration
        id: cloudflare-config
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          required_values=(
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_PROJECT_NAME
          )

          missing_values=()
          for name in "${required_values[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing_values+=("$name")
            fi
          done

          if (( ${#missing_values[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare Pages deployment skipped; missing required configuration: ${missing_values[*]}."
            {
              echo "## Cloudflare Pages deployment skipped"
              echo
              echo "Missing required configuration: ${missing_values[*]}."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ ! "$CLOUDFLARE_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::CLOUDFLARE_PROJECT_NAME must contain only lowercase letters, numbers, and hyphens."
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Prepare deployment artifact
        if: steps.cloudflare-config.outputs.configured == 'true'
        shell: bash
        run: |
          install -m 700 -d "$RUNNER_TEMP/site"
          cp source/index.html source/_headers "$RUNNER_TEMP/site/"
          cp -R source/assets source/css source/js "$RUNNER_TEMP/site/"

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare-config.outputs.configured == 'true'
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy ${{ runner.temp }}/site
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
            --branch=main
            --commit-hash=${{ steps.revision.outputs.sha }}

      - name: Publish deployment summary
        if: steps.cloudflare-config.outputs.configured == 'true'
        shell: bash
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          {
            echo "## Déploiement Cloudflare Pages terminé"
            echo
            echo "- Révision : \`${REVISION}\`"
            echo "- Déploiement : ${DEPLOYMENT_URL}"
            if [[ -n "$PRODUCTION_URL" ]]; then
              echo "- Site : ${PRODUCTION_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
